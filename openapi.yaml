openapi: 3.0.3
info:
  title: Zlagoda API Gateway
  version: 0.1.0
  description: HTTP API exposed by the api-gateway service.

servers:
  - url: http://localhost:8080/api/v1
    description: Local API gateway

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Employees
  - name: Categories
  - name: Products
  - name: Store Products
  - name: Customer Cards
  - name: Checks
  - name: Reports

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: User logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /employees:
    get:
      tags: [Employees]
      summary: List employees
      description: Returns all employees sorted by surname, or filters by role when `role` is provided.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
          example: cashier
      responses:
        "200":
          description: Employees returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /employees/me:
    get:
      tags: [Employees]
      summary: Get authenticated employee
      description: Uses the authenticated `user_id` as the employee ID.
      responses:
        "200":
          description: Employee returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /employees/contacts:
    get:
      tags: [Employees]
      summary: Find employee contact data
      parameters:
        - name: surname
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: patronymic
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Employee contacts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeContact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get employee by ID
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
      responses:
        "200":
          description: Employee returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Employees]
      summary: Fully update employee
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Employees]
      summary: Delete employee
      parameters:
        - $ref: "#/components/parameters/EmployeeID"
      responses:
        "204":
          description: Employee deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      tags: [Categories]
      summary: List categories sorted by name
      responses:
        "200":
          description: Categories returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories/{number}:
    get:
      tags: [Categories]
      summary: Get category by number
      parameters:
        - $ref: "#/components/parameters/CategoryNumber"
      responses:
        "200":
          description: Category returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Categories]
      summary: Fully update category
      parameters:
        - $ref: "#/components/parameters/CategoryNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Categories]
      summary: Delete category
      parameters:
        - $ref: "#/components/parameters/CategoryNumber"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products:
    get:
      tags: [Products]
      summary: List or search products
      description: Returns all products sorted by name, searches by name, or filters by category.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: category_number
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Products returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Product returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Products]
      summary: Fully update product
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "204":
          description: Product deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /store-products:
    get:
      tags: [Store Products]
      summary: List store products
      description: Supports sorting, promo filtering, and category filtering.
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [quantity, name]
            default: quantity
        - name: promo
          in: query
          required: false
          schema:
            type: boolean
        - name: category_number
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Store products returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetailedStoreProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Store Products]
      summary: Create store product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreProductRequest"
      responses:
        "201":
          description: Store product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /store-products/{upc}:
    get:
      tags: [Store Products]
      summary: Get detailed store product by UPC
      parameters:
        - $ref: "#/components/parameters/UPC"
      responses:
        "200":
          description: Store product returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedStoreProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Store Products]
      summary: Fully update store product
      parameters:
        - $ref: "#/components/parameters/UPC"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreProductRequest"
      responses:
        "200":
          description: Store product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Store Products]
      summary: Delete store product
      parameters:
        - $ref: "#/components/parameters/UPC"
      responses:
        "204":
          description: Store product deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer-cards:
    get:
      tags: [Customer Cards]
      summary: List or search customer cards
      parameters:
        - name: surname
          in: query
          required: false
          schema:
            type: string
        - name: percent
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Customer cards returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Customer Cards]
      summary: Create customer card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerCardRequest"
      responses:
        "201":
          description: Customer card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer-cards/{number}:
    get:
      tags: [Customer Cards]
      summary: Get customer card by number
      parameters:
        - $ref: "#/components/parameters/CardNumber"
      responses:
        "200":
          description: Customer card returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Customer Cards]
      summary: Fully update customer card
      parameters:
        - $ref: "#/components/parameters/CardNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerCardRequest"
      responses:
        "200":
          description: Customer card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Customer Cards]
      summary: Delete customer card
      parameters:
        - $ref: "#/components/parameters/CardNumber"
      responses:
        "204":
          description: Customer card deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /checks:
    get:
      tags: [Checks]
      summary: List checks
      description: Returns all checks, cashier checks for one date, or cashier checks for a period.
      parameters:
        - name: cashier_id
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: RFC3339 datetime or YYYY-MM-DD.
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: RFC3339 datetime or YYYY-MM-DD.
      responses:
        "200":
          description: Checks returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Checks]
      summary: Create check header
      description: Creates only the check header. Use `/checks/{number}/items` to add sale items until full transactional check creation is implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckRequest"
      responses:
        "201":
          description: Check created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /checks/{number}:
    get:
      tags: [Checks]
      summary: Get full check by number
      parameters:
        - $ref: "#/components/parameters/CheckNumber"
      responses:
        "200":
          description: Full check rows returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FullCheckItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Checks]
      summary: Delete check
      parameters:
        - $ref: "#/components/parameters/CheckNumber"
      responses:
        "204":
          description: Check deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /checks/{number}/items:
    post:
      tags: [Checks]
      summary: Add sale item to check
      description: The check number is taken from the URL path.
      parameters:
        - $ref: "#/components/parameters/CheckNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleItemRequest"
      responses:
        "201":
          description: Sale item created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/checks/details:
    get:
      tags: [Reports]
      summary: Get check details report
      parameters:
        - name: cashier_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Check details returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports/checks/total:
    get:
      tags: [Reports]
      summary: Get total check sum report
      parameters:
        - name: cashier_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Total returned
          content:
            application/json:
              schema:
                type: object
                required: [total_sum]
                properties:
                  total_sum:
                    type: number
                    format: double
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports/products/{id}/sold-quantity:
    get:
      tags: [Reports]
      summary: Get sold quantity for one product in a period
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Sold quantity returned
          content:
            application/json:
              schema:
                type: object
                required: [product_id, total_quantity]
                properties:
                  product_id:
                    type: integer
                    format: int32
                  total_quantity:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EmployeeID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CategoryNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
    UPC:
      name: upc
      in: path
      required: true
      schema:
        type: string
    CardNumber:
      name: number
      in: path
      required: true
      schema:
        type: string
    CheckNumber:
      name: number
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        description: RFC3339 datetime or YYYY-MM-DD.
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        description: RFC3339 datetime or YYYY-MM-DD.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: manager
        password:
          type: string
          format: password
          example: password123

    AuthTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    CreateEmployeeRequest:
      type: object
      required:
        - id
        - surname
        - name
        - role
        - salary
        - date_of_birth
        - date_of_start
        - phone_number
        - city
        - street
        - zip_code
      properties:
        id:
          type: string
          example: EMP001
        surname:
          type: string
        name:
          type: string
        patronymic:
          type: string
          nullable: true
        role:
          type: string
          example: cashier
        salary:
          type: number
          format: double
        date_of_birth:
          type: string
          format: date-time
        date_of_start:
          type: string
          format: date-time
        phone_number:
          type: string
        city:
          type: string
        street:
          type: string
        zip_code:
          type: string

    UpdateEmployeeRequest:
      allOf:
        - type: object
          required:
            - surname
            - name
            - role
            - salary
            - date_of_birth
            - date_of_start
            - phone_number
            - city
            - street
            - zip_code
          properties:
            surname:
              type: string
            name:
              type: string
            patronymic:
              type: string
              nullable: true
            role:
              type: string
              example: cashier
            salary:
              type: number
              format: double
            date_of_birth:
              type: string
              format: date-time
            date_of_start:
              type: string
              format: date-time
            phone_number:
              type: string
            city:
              type: string
            street:
              type: string
            zip_code:
              type: string
      description: Same fields as create, except the ID is taken from the path.

    Employee:
      allOf:
        - $ref: "#/components/schemas/CreateEmployeeRequest"

    EmployeeContact:
      type: object
      properties:
        phone_number:
          type: string
        city:
          type: string
        street:
          type: string
        zip_code:
          type: string

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Dairy

    Category:
      type: object
      properties:
        number:
          type: integer
          format: int32
        name:
          type: string

    ProductRequest:
      type: object
      required: [category_number, name, characteristics]
      properties:
        category_number:
          type: integer
          format: int32
        name:
          type: string
        producer:
          type: string
          nullable: true
        characteristics:
          type: string

