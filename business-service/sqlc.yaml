version: "2"

sql:
    - engine: postgresql
      schema:
        - "internal/database/migrations"
      queries:
        - "internal/product/queries.sql"
      gen:
          go:
              package: "productdb"
              out: "internal/product/sqlc"
              sql_package: "pgx/v5"

    - engine: postgresql
      schema:
        - "internal/database/migrations"
      queries:
        - "internal/customercard/queries.sql"
      gen:
        go:
          package: "customercarddb"
          out: "internal/customercard/sqlc"
          sql_package: "pgx/v5"

