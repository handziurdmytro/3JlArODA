version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - business-service

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      - crypto-service

  business-service:
    build: ./business-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/zlagoda?sslmode=disable

  crypto-service:
    build: ./crypto-service
    ports:
      - "8083:8083"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zlagoda
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
