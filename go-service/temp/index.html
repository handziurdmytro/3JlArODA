<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZLAGODA — AIS Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Unbounded:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #1e2530;
    --accent: #00e5a0;
    --accent2: #0077ff;
    --danger: #ff3b5c;
    --warn: #ffb020;
    --text: #e8edf5;
    --muted: #5a6478;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Unbounded', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .logo span { color: var(--muted); font-weight: 300; }

  .base-url-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .base-url-wrap label { color: var(--muted); white-space: nowrap; }
  .base-url-wrap input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  .base-url-wrap input:focus { border-color: var(--accent2); }

  .token-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .token-wrap label { color: var(--muted); white-space: nowrap; }
  .token-wrap input {
    width: 220px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 4px;
    outline: none;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 53px);
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-section {
    margin-bottom: 4px;
  }
  .sidebar-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 8px 16px 4px;
    text-transform: uppercase;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    color: var(--muted);
  }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active {
    border-left-color: var(--accent);
    background: var(--surface2);
    color: var(--accent);
  }
  .method-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .GET  { background: #003d2e; color: var(--accent); }
  .POST { background: #002a5c; color: #4da6ff; }
  .PUT  { background: #3d2d00; color: var(--warn); }
  .DELETE { background: #3d0010; color: var(--danger); }

  /* MAIN PANEL */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .request-panel {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .endpoint-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .endpoint-method {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .endpoint-path {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
  }
  .endpoint-desc {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }

  .params-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .param-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .param-group label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .param-group input, .param-group select, .param-group textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }
  .param-group input:focus,
  .param-group select:focus,
  .param-group textarea:focus { border-color: var(--accent2); }
  .param-group select option { background: var(--surface); }

  .body-area {
    margin-bottom: 12px;
  }
  .body-area label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
  }
  .body-area textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: #7dd3fc;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 4px;
    outline: none;
    height: 100px;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .body-area textarea:focus { border-color: var(--accent2); }

  .send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 9px 24px;
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .send-btn:hover { background: #00ffb3; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

  /* RESPONSE */
  .response-panel {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .response-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .response-title { color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .response-status {
    font-weight: 700;
    font-size: 13px;
  }
  .response-time { color: var(--muted); font-size: 11px; margin-left: auto; }

  .response-body {
    flex: 1;
    overflow: auto;
    padding: 16px 24px;
    background: var(--bg);
  }
  pre {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* JSON syntax highlight */
  .json-key    { color: #7dd3fc; }
  .json-string { color: #86efac; }
  .json-number { color: #fbbf24; }
  .json-bool   { color: #c084fc; }
  .json-null   { color: var(--muted); }

  .placeholder {
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .placeholder::before {
    content: '';
    display: block;
    width: 3px;
    height: 40px;
    background: var(--border);
    border-radius: 2px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 10px;
    border-radius: 3px;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.15s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent2); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">ZLAGODA <span>/ AIS</span></div>
  <div class="base-url-wrap">
    <label>BASE URL</label>
    <input type="text" id="baseUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
  </div>
  <div class="token-wrap">
    <label>JWT</label>
    <input type="text" id="jwtToken" placeholder="Bearer eyJ...">
  </div>
  <div class="status-dot" id="statusDot" title="Статус з'єднання"></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="request-panel" id="requestPanel">
      <div class="endpoint-header">
        <span class="endpoint-method GET">GET</span>
        <span class="endpoint-path" id="epPath">/api/v1/...</span>
        <span class="endpoint-desc" id="epDesc">Оберіть ендпоінт зліва</span>
      </div>
      <div id="paramsContainer"></div>
      <div id="bodyContainer"></div>
      <button class="send-btn" id="sendBtn" onclick="sendRequest()">▶ SEND</button>
    </div>
    <div class="response-panel">
      <div class="response-header">
        <span class="response-title">RESPONSE</span>
        <span class="response-status" id="respStatus">—</span>
        <button class="copy-btn" onclick="copyResponse()">COPY</button>
        <span class="response-time" id="respTime"></span>
      </div>
      <div class="response-body" id="responseBody">
        <div class="placeholder">Натисніть SEND щоб виконати запит</div>
      </div>
    </div>
  </div>
</div>

const ENDPOINTS = [
  // AUTH

  // EMPLOYEES

  { group: "Employees", method: "GET", path: "/api/v1/employees/{id}", desc: "Працівник за ID",

  { group: "Employees", method: "GET", path: "/api/v1/employees/search", desc: "Пошук за прізвищем",

  { group: "Employees", method: "POST", path: "/api/v1/employees", desc: "Додати працівника",
    body: `{\n  "empl_surname": "Іваненко",\n  "empl_name": "Олег",\n  "empl_patronymic": "Петрович",\n  "empl_role": "cashier",\n  "salary": 15000.00,\n  "date_of_birth": "1990-05-15",\n  "date_of_start": "2023-01-10",\n  "phone_number": "+380501234567",\n  "city": "Київ",\n  "street": "вул. Хрещатик 1",\n  "zip_code": "01001"\n}` },
  { group: "Employees", method: "PUT", path: "/api/v1/employees/{id}", desc: "Оновити працівника",
    pathParams: ["id"],
    body: `{\n  "salary": 18000.00,\n  "phone_number": "+380507654321"\n}` },
  { group: "Employees", method: "DELETE", path: "/api/v1/employees/{id}", desc: "Видалити працівника",
    pathParams: ["id"] },

  // CATEGORIES
  { group: "Categories", method: "GET", path: "/api/v1/categories", desc: "Всі категорії (sorted by name)" },
  { group: "Categories", method: "POST", path: "/api/v1/categories", desc: "Додати категорію",
    body: `{\n  "category_name": "Молочні продукти"\n}` },
  { group: "Categories", method: "PUT", path: "/api/v1/categories/{id}", desc: "Оновити категорію",
    pathParams: ["id"],
    body: `{\n  "category_name": "Ковбасні вироби"\n}` },
  { group: "Categories", method: "DELETE", path: "/api/v1/categories/{id}", desc: "Видалити категорію",
    pathParams: ["id"] },

  // PRODUCTS
  { group: "Products", method: "GET", path: "/api/v1/products", desc: "Всі товари (sorted by name)",
    params: [{ key: "category_id", label: "ID категорії", placeholder: "1" }] },
  { group: "Products", method: "GET", path: "/api/v1/products/{id}", desc: "Товар за ID",
    pathParams: ["id"] },
  { group: "Products", method: "POST", path: "/api/v1/products", desc: "Додати товар",
    body: `{\n  "category_number": 1,\n  "product_name": "Молоко 2.5%",\n  "producer": "Яготинське",\n  "characteristics": "Пастеризоване, 1л"\n}` },
  { group: "Products", method: "PUT", path: "/api/v1/products/{id}", desc: "Оновити товар",
    pathParams: ["id"],
    body: `{\n  "product_name": "Молоко 3.2%",\n  "characteristics": "Ультрапастеризоване, 1л"\n}` },
  { group: "Products", method: "DELETE", path: "/api/v1/products/{id}", desc: "Видалити товар",
    pathParams: ["id"] },

  // STORE PRODUCTS
  { group: "Store Products", method: "GET", path: "/api/v1/store-products", desc: "Всі товари у магазині",
    params: [
      { key: "sort", label: "Сортування", placeholder: "quantity/name" },
      { key: "promotional", label: "Тільки акційні", placeholder: "true/false" }
    ] },
  { group: "Store Products", method: "GET", path: "/api/v1/store-products/{upc}", desc: "Товар за UPC",
    pathParams: ["upc"] },
  { group: "Store Products", method: "POST", path: "/api/v1/store-products", desc: "Додати товар у магазин",
    body: `{\n  "upc": "123456789012",\n  "upc_prom": null,\n  "id_product": 1,\n  "selling_price": 45.50,\n  "products_number": 100,\n  "promotional_product": false\n}` },
  { group: "Store Products", method: "PUT", path: "/api/v1/store-products/{upc}", desc: "Оновити товар у магазині",
    pathParams: ["upc"],
    body: `{\n  "selling_price": 42.00,\n  "products_number": 95\n}` },
  { group: "Store Products", method: "DELETE", path: "/api/v1/store-products/{upc}", desc: "Видалити товар зі складу",
    pathParams: ["upc"] },

  // CUSTOMER CARDS
  { group: "Customer Cards", method: "GET", path: "/api/v1/customer-cards", desc: "Всі карти клієнтів",
    params: [{ key: "percent", label: "Відсоток знижки", placeholder: "5" }] },
  { group: "Customer Cards", method: "GET", path: "/api/v1/customer-cards/{card_number}", desc: "Карта за номером",
    pathParams: ["card_number"] },
  { group: "Customer Cards", method: "POST", path: "/api/v1/customer-cards", desc: "Додати карту клієнта",
    body: `{\n  "card_number": "CC0000000001",\n  "cust_surname": "Петренко",\n  "cust_name": "Марія",\n  "cust_patronymic": "Іванівна",\n  "phone_number": "+380631234567",\n  "city": "Київ",\n  "street": "вул. Лесі Українки 5",\n  "zip_code": "01133",\n  "percent": 5\n}` },
  { group: "Customer Cards", method: "PUT", path: "/api/v1/customer-cards/{card_number}", desc: "Оновити карту клієнта",
    pathParams: ["card_number"],
    body: `{\n  "phone_number": "+380639876543",\n  "percent": 10\n}` },
  { group: "Customer Cards", method: "DELETE", path: "/api/v1/customer-cards/{card_number}", desc: "Видалити карту клієнта",
    pathParams: ["card_number"] },

  // CHECKS
  { group: "Checks", method: "GET", path: "/api/v1/checks", desc: "Чеки за фільтром",
    params: [
      { key: "cashier_id", label: "ID касира", placeholder: "EMP002" },
      { key: "date_from", label: "Дата від", placeholder: "2024-01-01" },
      { key: "date_to", label: "Дата до", placeholder: "2024-12-31" }
    ] },
  { group: "Checks", method: "GET", path: "/api/v1/checks/{check_number}", desc: "Чек за номером",
    pathParams: ["check_number"] },
  { group: "Checks", method: "GET", path: "/api/v1/checks/stats/total", desc: "Загальна сума за касиром/період",
    params: [
      { key: "cashier_id", label: "ID касира (опц.)", placeholder: "EMP002" },
      { key: "date_from", label: "Дата від", placeholder: "2024-01-01" },
      { key: "date_to", label: "Дата до", placeholder: "2024-12-31" }
    ] },
  { group: "Checks", method: "GET", path: "/api/v1/checks/stats/product", desc: "К-сть проданого товару за період",
    params: [
      { key: "upc", label: "UPC товару", placeholder: "123456789012" },
      { key: "date_from", label: "Дата від", placeholder: "2024-01-01" },
      { key: "date_to", label: "Дата до", placeholder: "2024-12-31" }
    ] },
  { group: "Checks", method: "POST", path: "/api/v1/checks", desc: "Створити чек (касир)",
    body: `{\n  "card_number": "CC0000000001",\n  "sales": [\n    { "upc": "123456789012", "product_number": 2 },\n    { "upc": "210987654321", "product_number": 1 }\n  ]\n}` },
  { group: "Checks", method: "DELETE", path: "/api/v1/checks/{check_number}", desc: "Видалити чек",
    pathParams: ["check_number"] },
];

let currentEndpoint = null;

// BUILD SIDEBAR
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const groups = {};
  ENDPOINTS.forEach((ep, i) => {
    if (!groups[ep.group]) groups[ep.group] = [];
    groups[ep.group].push({ ...ep, index: i });
  });

  sidebar.innerHTML = '';
  for (const [group, eps] of Object.entries(groups)) {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section';
    sec.innerHTML = `<div class="sidebar-title">${group}</div>`;
    eps.forEach(ep => {
      const item = document.createElement('div');
      item.className = 'sidebar-item';
      item.dataset.index = ep.index;
      item.innerHTML = `<span class="method-badge ${ep.method}">${ep.method}</span>${ep.path.split('/').pop() || ep.path}`;
      item.onclick = () => selectEndpoint(ep.index, item);
      sec.appendChild(item);
    });
    sidebar.appendChild(sec);
  }
}

function selectEndpoint(index, el) {
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  currentEndpoint = ENDPOINTS[index];
  renderRequestPanel();
}

function renderRequestPanel() {
  const ep = currentEndpoint;
  const methodColors = { GET: 'var(--accent)', POST: '#4da6ff', PUT: 'var(--warn)', DELETE: 'var(--danger)' };

  document.getElementById('epPath').textContent = ep.path;
  document.getElementById('epDesc').textContent = ep.desc;

  const methodEl = document.querySelector('.endpoint-method');
  methodEl.textContent = ep.method;
  methodEl.className = `endpoint-method ${ep.method}`;
  methodEl.style.background = '';

  // Path params
  let html = '';
  if (ep.pathParams?.length) {
    html += '<div class="params-grid">';
    ep.pathParams.forEach(p => {
      html += `<div class="param-group">
        <label>PATH: ${p}</label>
        <input type="text" id="path_${p}" placeholder="${p}">
      </div>`;
    });
    html += '</div>';
  }

  // Query params
  if (ep.params?.length) {
    html += '<div class="params-grid">';
    ep.params.forEach(p => {
      html += `<div class="param-group">
        <label>QUERY: ${p.label}</label>
        <input type="text" id="param_${p.key}" placeholder="${p.placeholder}">
      </div>`;
    });
    html += '</div>';
  }

  document.getElementById('paramsContainer').innerHTML = html;

  // Body
  const bodyHtml = ep.body ? `
    <div class="body-area">
      <label>REQUEST BODY (JSON)</label>
      <textarea id="requestBody">${ep.body}</textarea>
    </div>` : '';
  document.getElementById('bodyContainer').innerHTML = bodyHtml;
}

async function sendRequest() {
  const ep = currentEndpoint;
  if (!ep) return;

  const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
  const token = document.getElementById('jwtToken').value;
  const btn = document.getElementById('sendBtn');

  // Build URL
  let path = ep.path;
  if (ep.pathParams) {
    ep.pathParams.forEach(p => {
      const val = document.getElementById(`path_${p}`)?.value || `:${p}`;
      path = path.replace(`{${p}}`, encodeURIComponent(val));
    });
  }

  // Query params
  const qp = new URLSearchParams();
  if (ep.params) {
    ep.params.forEach(p => {
      const val = document.getElementById(`param_${p.key}`)?.value;
      if (val) qp.set(p.key, val);
    });
  }
  const url = `${baseUrl}${path}${qp.toString() ? '?' + qp.toString() : ''}`;

  // Headers
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = token.startsWith('Bearer') ? token : `Bearer ${token}`;

  // Body
  let body = undefined;
  const bodyEl = document.getElementById('requestBody');
  if (bodyEl?.value) {
    try { body = bodyEl.value; JSON.parse(body); }
    catch { showResponse(null, 'Невалідний JSON в body', 0); return; }
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> SENDING';
  document.getElementById('responseBody').innerHTML = '<div class="placeholder"><span class="spinner"></span>&nbsp; Виконується запит...</div>';
  document.getElementById('respStatus').textContent = '—';
  document.getElementById('respTime').textContent = '';

  const t0 = Date.now();
  try {
    const res = await fetch(url, { method: ep.method, headers, body });
    const elapsed = Date.now() - t0;
    let text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch {}
    showResponse(res.status, parsed || text, elapsed);
    setDot(res.ok ? 'ok' : 'err');
  } catch (e) {
    const elapsed = Date.now() - t0;
    showResponse(null, e.message, elapsed);
    setDot('err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ SEND';
  }
}

function showResponse(status, data, elapsed) {
  const statusEl = document.getElementById('respStatus');
  const timeEl = document.getElementById('respTime');
  const bodyEl = document.getElementById('responseBody');

  if (status) {
    const color = status < 300 ? 'var(--accent)' : status < 500 ? 'var(--warn)' : 'var(--danger)';
    statusEl.textContent = status;
    statusEl.style.color = color;
  } else {
    statusEl.textContent = 'ERR';
    statusEl.style.color = 'var(--danger)';
  }

  timeEl.textContent = elapsed ? `${elapsed}ms` : '';

  if (typeof data === 'object') {
    bodyEl.innerHTML = `<pre>${syntaxHighlight(JSON.stringify(data, null, 2))}</pre>`;
  } else {
    bodyEl.innerHTML = `<pre style="color:var(--danger)">${escapeHtml(String(data))}</pre>`;
  }
}

function syntaxHighlight(json) {
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
    let cls = 'json-number';
    if (/^"/.test(match)) {
      cls = /:$/.test(match) ? 'json-key' : 'json-string';
    } else if (/true|false/.test(match)) {
      cls = 'json-bool';
    } else if (/null/.test(match)) {
      cls = 'json-null';
    }
    return `<span class="${cls}">${escapeHtml(match)}</span>`;
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setDot(state) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + state;
}

function copyResponse() {
  const pre = document.querySelector('#responseBody pre');
  if (pre) navigator.clipboard.writeText(pre.innerText);
}

// PING on base url change
let pingTimeout;
document.getElementById('baseUrl').addEventListener('input', () => {
  clearTimeout(pingTimeout);
  pingTimeout = setTimeout(pingServer, 800);
});

async function pingServer() {
  const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
  try {
    const r = await fetch(`${base}/health`, { signal: AbortSignal.timeout(2000) });
    setDot(r.ok ? 'ok' : 'err');
  } catch { setDot('err'); }
}

buildSidebar();
</script>
