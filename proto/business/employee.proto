syntax = "proto3";

package business.employee;

option go_package = "github.com/handziurdmytro/3JlArODA/business-service/pb/business/employee;employeepb";

service EmployeeService {
  rpc CreateEmployee(CreateEmployeeRequest) returns (EmployeeResponse);
  rpc UpdateEmployee(UpdateEmployeeRequest) returns (EmployeeResponse);
  rpc DeleteEmployee(DeleteEmployeeRequest) returns (DeleteEmployeeResponse);
  rpc GetEmployee(GetEmployeeRequest) returns (EmployeeResponse);
  rpc GetAllEmployees(GetAllEmployeesRequest) returns (GetEmployeesResponse);
  rpc GetEmployeesByRole(GetEmployeesByRoleRequest) returns (GetEmployeesResponse);
  rpc GetEmployeeContactsBySurname(GetEmployeeContactsBySurnameRequest) returns (GetEmployeeContactsResponse);
  rpc GetEmployeeContactsByFullName(GetEmployeeContactsByFullNameRequest) returns (GetEmployeeContactsResponse);
  rpc GetCashierPerformance(GetCashierPerformanceRequest) returns (GetCashierPerformanceResponse);
  rpc GetBestCashiersByPromo(GetBestCashiersByPromoRequest) returns (GetBestCashiersByPromoResponse);
}

message Employee {
  string id = 1;
  string surname = 2;
  string name = 3;
  optional string patronymic = 4;
  string role = 5;
  double salary = 6;
  string date_of_birth = 7;
  string date_of_start = 8;
  string phone_number = 9;
  string city = 10;
  string street = 11;
  string zip_code = 12;
}

message EmployeeContact {
  string phone_number = 1;
  string city = 2;
  string street = 3;
  string zip_code = 4;
}

message CashierPerformance {
  string id = 1;
  string name = 2;
  string surname = 3;
  optional string patronymic = 4;
  int64 total_checks = 5;
  int64 total_items_sold = 6;
  double total_revenue = 7;
}

message BestCashierByPromo {
  string id = 1;
  string name = 2;
  string surname = 3;
}

message CreateEmployeeRequest {
  string id = 1;
  string surname = 2;
  string name = 3;
  optional string patronymic = 4;
  string role = 5;
  double salary = 6;
  string date_of_birth = 7;
  string date_of_start = 8;
  string phone_number = 9;
  string city = 10;
  string street = 11;
  string zip_code = 12;
}

message UpdateEmployeeRequest {
  string id = 1;
  string surname = 2;
  string name = 3;
  optional string patronymic = 4;
  string role = 5;
  double salary = 6;
  string date_of_birth = 7;
  string date_of_start = 8;
  string phone_number = 9;
  string city = 10;
  string street = 11;
  string zip_code = 12;
}

message DeleteEmployeeRequest {
  string id = 1;
}

message DeleteEmployeeResponse {
  bool success = 1;
}

message GetEmployeeRequest {
  string id = 1;
}

message GetAllEmployeesRequest {}

message GetEmployeesByRoleRequest {
  string role = 1;
}

message GetEmployeeContactsBySurnameRequest {
  string surname = 1;
}

message GetEmployeeContactsByFullNameRequest {
  string surname = 1;
  string name = 2;
  optional string patronymic = 3;
}

message GetCashierPerformanceRequest {
  string from = 1;
  string to = 2;
  double min_revenue = 3;
}

message GetBestCashiersByPromoRequest {}

message EmployeeResponse {
  Employee employee = 1;
}

message GetEmployeesResponse {
  repeated Employee employees = 1;
}

message GetEmployeeContactsResponse {
  repeated EmployeeContact contacts = 1;
}

message GetCashierPerformanceResponse {
  repeated CashierPerformance performance = 1;
}

message GetBestCashiersByPromoResponse {
  repeated BestCashierByPromo cashiers = 1;
}
