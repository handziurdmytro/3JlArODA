syntax = "proto3";

package auth_secret;

option go_package = "./pb";

service AuthSecretService {
  rpc HashPassword (HashRequest) returns (HashResponse);
  rpc VerifyPassword (VerifyRequest) returns (VerifyResponse);
  rpc SignJWT (SignJWTRequest) returns (SignJWTResponse);
  rpc ValidateJWT (ValidateJWTRequest) returns (ValidateJWTResponse);
}

message HashRequest {
  string plain_password = 1;
}

message HashResponse {
  string hash_string = 1;
}

message VerifyRequest {
  string plain_password = 1;
  string hash_string = 2;
}

message VerifyResponse {
  bool is_valid = 1;
}

message SignJWTRequest {
  string user_id = 1;
  string username = 2;
}

message SignJWTResponse {
  string token = 1;
}

message ValidateJWTRequest {
  string token = 1;
}

message ValidateJWTResponse {
  string user_id = 1;
  string username = 2;
  bool   is_valid = 3;
}