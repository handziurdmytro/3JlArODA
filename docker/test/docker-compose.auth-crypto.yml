services:

  postgres:
    image: postgres:15-alpine
    container_name: zlahoda-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cisco
    ports:
      - "5432:5432"
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-migrations:
    image: golang:alpine
    container_name: zlahoda-auth-migrations
    volumes:
      - ../../auth-service/migrations:/migrations
    command: >
      sh -c "go install github.com/pressly/goose/v3/cmd/goose@latest &&
      /go/bin/goose -dir /migrations postgres 'postgres://postgres:cisco@postgres:5432/zlahoda_users?sslmode=disable' up"
    depends_on:
      postgres:
        condition: service_healthy

  crypto-service:
    build:
      context: ../../
      dockerfile: crypto-service/Dockerfile
    container_name: zlahoda-crypto
    ports:
      - "3030:3030"
    env_file:
      - ../../crypto-service/.env
    restart: unless-stopped

  auth-service:
    build:
      context: ../../
      dockerfile: auth-service/Dockerfile
    container_name: zlahoda-auth
    ports:
      - "3131:3131"
    env_file:
      - ../../auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrations:
        condition: service_completed_successfully
      crypto-service:
        condition: service_started
    restart: unless-stopped